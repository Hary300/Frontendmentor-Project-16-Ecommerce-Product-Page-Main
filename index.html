<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/icon-cart.svg"
    />

    <link rel="stylesheet" href="/src/output.css" />

    <title>E-commerce product page</title>

    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
    <script type="module" src="./script.js" defer></script>
  </head>
  <body>
    <div class="relative max-w-360 mx-auto min-h-screen">
      <div
        class="sm:px-10 lg:px-15 xl:px-30 flex flex-col sm:gap-4 md:gap-8 lg:gap-12"
      >
        <!-- HEADER -->
        <header
          class="px-4 sm:px-0 flex justify-between items-center pt-4 pb-4 md:pt-0 md:pb-0 md:border-b md:border-grayish-blue"
        >
          <div class="flex items-end md:items-center gap-4 md:gap-10">
            <div id="hamburger-menu-button" class="md:hidden">
              <img
                src="./assets/images/icon-menu.svg"
                alt="hamburger menu button"
              />
            </div>
            <div>
              <a href="#home">
                <img src="./assets/images/logo.svg" alt="logo image" />
              </a>
            </div>
            <ul id="desktop-nav-links" class="hidden md:flex gap-4"></ul>
          </div>

          <div class="flex gap-4 items-center">
            <div id="cart-container" class="relative cursor-pointer">
              <img
                id="cart-icon"
                src="./assets/images/icon-cart.svg"
                alt="cart icon"
              />
            </div>

            <div
              class="size-7 md:size-8 overflow-hidden rounded-full shrink-0 border-2 border-orange/0 hover:border-orange cursor-pointer transition-all duration-300 ease-in-out"
            >
              <img
                id="avatar-icon"
                src="./assets/images/avatar.jpg"
                alt="avatar"
              />
            </div>
          </div>
        </header>

        <!-- PRODUCT DETAIL -->
        <section
          id="product-details"
          class="flex flex-col md:flex-row gap-4 md:gap-8 lg:gap-15 md:items-center lg:justify-center max-w-270 mx-auto"
        >
          <div id="product-images" class="w-full md:max-w-70 lg:max-w-100">
            <div class="hidden sm:flex flex-col gap-4">
              <div
                id="active-img-container"
                class="relative sm:rounded-xl overflow-hidden aspect-square cursor-pointer"
              ></div>
              <div
                id="thumbnail-container"
                class="flex sm:gap-2 lg:gap-4"
              ></div>
            </div>

            <div id="carousel-wrapper" class="relative sm:hidden">
              <div id="viewport" class="overflow-hidden">
                <div
                  id="items-container"
                  class="flex transition-all duration-300 ease-in-out"
                ></div>
              </div>

              <button
                id="next-button"
                class="absolute right-4 top-1/2 -translate-y-1/2 size-8 rounded-full bg-light-grayish-blue shrink-0 flex justify-center items-center disabled:opacity-50 disabled:pointer-events-none disabled:cursor-not-allowed"
              >
                <img
                  src="./assets/images/icon-next.svg"
                  alt="next button"
                  class="w-2"
                />
              </button>

              <button
                id="prev-button"
                class="absolute left-4 top-1/2 -translate-y-1/2 size-8 rounded-full bg-light-grayish-blue shrink-0 flex justify-center items-center disabled:opacity-50 disabled:pointer-events-none disabled:cursor-not-allowed"
              >
                <img
                  src="./assets/images/icon-previous.svg"
                  alt="prev button"
                  class="w-2"
                />
              </button>
            </div>
          </div>

          <div
            id="product-info"
            class="flex flex-col gap-4 px-4 sm:px-0 sm:gap-6 lg:gap-10"
          >
            <div class="flex flex-col gap-2 lg:gap-4">
              <p
                id="company-name"
                class="text-dark-grayish-blue font-bold text-xs lg:text-sm"
              ></p>
              <p id="product-name" class="text-3xl md:text-5xl font-bold"></p>
            </div>

            <p
              id="product-description"
              class="text-dark-grayish-blue md:max-w-120 lg:text-lg"
            ></p>

            <div
              class="flex justify-between items-center md:flex-col md:items-start md:gap-4"
            >
              <div class="flex gap-4">
                <p id="final-price" class="font-bold text-xl lg:text-4xl"></p>
                <p
                  id="discount"
                  class="px-2 rounded-md bg-very-dark-blue flex justify-center items-center text-light-grayish-blue font-semibold text-sm lg:text-lg"
                ></p>
              </div>
              <p
                id="original-price"
                class="text-dark-grayish-blue line-through font-bold text-sm lg:text-xl"
              ></p>
            </div>

            <div class="flex flex-col gap-4 sm:flex-row">
              <div
                class="flex justify-between items-center px-4 h-10 lg:h-12 rounded-lg bg-light-grayish-blue w-full md:max-w-40"
              >
                <button id="dec-quantity">
                  <img
                    src="./assets/images/icon-minus.svg"
                    alt="minus icon"
                    class="cursor-pointer"
                  />
                </button>
                <p id="quantity" class="font-bold"></p>

                <button id="inc-quantity">
                  <img
                    src="./assets/images/icon-plus.svg"
                    alt="plus icon"
                    class="cursor-pointer"
                  />
                </button>
              </div>

              <button
                id="add-to-cart-button"
                class="bg-orange hover:bg-orange/80 h-10 lg:h-12 flex items-center justify-center w-full cursor-pointer rounded-xl md:max-w-70"
              >
                <div class="flex gap-2 items-center">
                  <img
                    src="./assets/images/icon-cart.svg"
                    alt="cart icon"
                    class="w-4"
                  />
                  <p class="font-bold">Add to cart</p>
                </div>
              </button>
            </div>
          </div>
        </section>

        <!-- FOOTER -->
        <footer class="attribution mt-10">
          Challenge by
          <a href="https://www.frontendmentor.io?ref=challenge"
            >Frontend Mentor</a
          >. Coded by <a href="https://github.com/Hary300">Hary300</a>.
        </footer>
      </div>

      <!-- MOBILE MENU -->
      <div
        id="overlay"
        class="fixed bg-black/50 inset-0 transition-opacity duration-300 ease-in-out pointer-events-none opacity-0"
      ></div>
      <div
        id="mobile-nav"
        class="absolute left-0 inset-y-0 flex flex-col gap-8 bg-white w-1/2 transition-transform duration-300 ease-in-out -translate-x-200 px-4 py-6"
      >
        <div>
          <img
            id="close-button"
            src="./assets/images/icon-close.svg"
            alt="cross button"
          />
        </div>
        <ul id="mobile-nav-links" class="flex flex-col gap-3"></ul>
      </div>

      <!-- CART BOX-->
      <div
        id="cart-box"
        class="absolute md:right-10 lg:right-15 xl:right-30 md:translate-0 top-20 py-4 rounded-xl flex flex-col w-[calc(100%-2rem)] right-1/2 translate-x-1/2 md:max-w-100 shadow-[0_0_10px_rgba(0,0,0,0.2)] bg-white transition-all duration-300 ease-in-out opacity-0 pointer-events-none max-h-100 overflow-auto"
      >
        <p class="px-4 pb-4 border-b border-grayish-blue font-bold">Cart</p>
        <div
          id="cart-content-container"
          class="flex flex-col p-4 gap-4 items-center justify-center"
        ></div>
      </div>

      <!-- LIGHTBOX -->
      <div
        id="lightbox-overlay"
        class="fixed bg-black/80 inset-0 transition-opacity duration-300 ease-in-out pointer-events-none opacity-0"
      ></div>

      <div
        id="lightbox"
        class="absolute top-1/2 -translate-y-1/2 left-1/2 -translate-x-1/2 flex flex-col gap-4 max-w-120 transition-opacity duration-300 ease-in-out pointer-events-none opacity-0"
      >
        <div id="lightbox-carusel-wrapper" class="relative">
          <div
            id="lightbox-carousel-viewport"
            class="overflow-hidden rounded-2xl"
          >
            <div
              id="lightbox-carousel-items"
              class="flex transition-all duration-300 ease-in-out"
            ></div>
          </div>

          <button
            id="lightbox-close-button"
            class="absolute right-0 bottom-[calc(100%+1rem)] text-white hover:text-orange cursor-pointer"
          ></button>

          <button
            id="lightbox-next-button"
            class="absolute right-4 top-1/2 -translate-y-1/2 size-12 rounded-full bg-light-grayish-blue shrink-0 flex justify-center items-center disabled:opacity-50 disabled:pointer-events-none disabled:cursor-not-allowed cursor-pointer hover:text-orange"
          ></button>

          <button
            id="lightbox-prev-button"
            class="absolute left-4 top-1/2 -translate-y-1/2 size-12 rounded-full bg-light-grayish-blue shrink-0 flex justify-center items-center disabled:opacity-50 disabled:pointer-events-none disabled:cursor-not-allowed cursor-pointer hover:text-orange"
          ></button>
        </div>

        <div
          id="lightbox-image-thumbnails-container"
          class="flex sm:gap-2 lg:gap-4"
        ></div>
      </div>
    </div>
  </body>
</html>
